<mat-toolbar color="primary" class="nav-bar">
  <span class="brand">AlphaBang</span>
  <span class="spacer"></span>
  <button matIconButton [matMenuTriggerFor]="settings" aria-label="Settings">
    <mat-icon>more_vert</mat-icon>
  </button>
</mat-toolbar>

<mat-menu #settings="matMenu" class="settings-menu" xPosition="before">
  <div class="menu-section">
    <mat-button-toggle-group
      [(value)]="selected"
      aria-label="Alphabet category"
      class="category-group"
    >
      <mat-button-toggle value="english">A</mat-button-toggle>
      <mat-button-toggle value="swaraborno">অ</mat-button-toggle>
      <mat-button-toggle value="benjonborno">ক</mat-button-toggle>
      <mat-button-toggle value="banglaDigits">১</mat-button-toggle>
      <mat-button-toggle value="digits">1</mat-button-toggle>
    </mat-button-toggle-group>
  </div>

  <mat-divider></mat-divider>

  <div class="menu-section">
    <div class="control-row">
      <span class="control-label">Square size</span>
      <span class="control-value">{{ squareSize() }}px</span>
    </div>
    <mat-slider [min]="80" [max]="250" [step]="10">
      <input
        matSliderThumb
        [value]="squareSize()"
        (valueChange)="squareSize.set($event)"
        aria-label="Square size"
      />
    </mat-slider>
  </div>

  <div class="menu-section">
    <div class="control-row">
      <span class="control-label">Font size</span>
      <span class="control-value">{{ fontSize() }}px</span>
    </div>
    <mat-slider [min]="32" [max]="120" [step]="2">
      <input
        matSliderThumb
        [value]="fontSize()"
        (valueChange)="fontSize.set($event)"
        aria-label="Font size"
      />
    </mat-slider>
  </div>

  <mat-divider></mat-divider>

  <div class="menu-section">
    <mat-slide-toggle [checked]="darkMode()" (change)="darkMode.set($event.checked)">
      Dark mode
    </mat-slide-toggle>
  </div>
</mat-menu>

<main class="grid" [style.grid-template-columns]="gridTemplate()">
  @for (tile of tiles(); track tile.char) {
    <mat-card
      appearance="outlined"
      class="letter-card"
      [style.color]="tile.color"
      [style.--tile-font-size]="fontSizePx()"
      (click)="play(tile.src)"
    >
      <mat-card-content>
        @if (tile.combining) {
          <span class="ghost">ক</span>
        }
        {{ tile.char }}
      </mat-card-content>
    </mat-card>
  }
</main>
